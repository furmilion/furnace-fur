name: Build Android APK

on:
  push:
    branches:
      - scsp-integration # Запускать сборку при пуше в твой бранч
  pull_request:
    branches:
      - scsp-integration

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Скачиваем репозиторий вместе со всеми субмодулями (критически важно!)
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Шаг 2: Устанавливаем Java (нужна для сборщика Gradle)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Шаг 3: Даем права на запуск скрипту gradlew
    # (Если gradlew лежит в папке sys/android, замени путь на "sys/android/gradlew")
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    # Шаг 4: Запускаем сборку отладочного APK (Debug собирается быстрее и не требует цифровой подписи)
    # (Если папка другая, измени "cd android")
    - name: Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    # Шаг 5: Выкладываем собранный APK в качестве артефакта, чтобы его можно было скачать
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: furnace-scsp-debug-apk
        # Путь к собранному файлу (может немного отличаться, но обычно он тут)
        path: android/app/build/outputs/apk/debug/*.apk